services:
  - type: web
    name: regional-tourism-scan-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://regional-tourism-scan.vercel.app
      - key: KTO_TOURISM_DATALAB_API_KEY
        sync: false
      - key: LOCAL_FINANCE365_API_KEY
        sync: false
      - key: KOSIS_API_KEY
        sync: false
