services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: rgap
      POSTGRES_USER: rgap
      POSTGRES_PASSWORD: rgap_local_only
    ports: ["5432:5432"]
    volumes: ["./database/init:/docker-entrypoint-initdb.d:ro", "pgdata:/var/lib/postgresql/data"]
volumes: {pgdata: {}}
